[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swesphere"
version = "0.3.0"
description = "Shallow-water equations on the rotating sphere: a verified model with documented, reproducible flow regimes"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Elias D. Nino-Ruiz", email = "enino@uninorte.edu.co"}]
keywords = ["shallow water", "sphere", "geophysical fluid dynamics", "numerical methods", "data assimilation", "testbed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyshtools>=4.10"]

[project.optional-dependencies]
test = ["pytest"]
plots = ["matplotlib"]
experiments = ["pandas", "matplotlib"]

[project.urls]
Homepage = "https://aml-cs.github.io/software/swesphere/"
Documentation = "https://aml-cs.github.io/software/swesphere/"
Repository = "https://github.com/enino84/swesphere"
Issues = "https://github.com/enino84/swesphere/issues"
Changelog = "https://github.com/enino84/swesphere/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
